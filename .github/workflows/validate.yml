name: Validate EvidenceProse

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile validator and tests
        run: python -m compileall -q scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate induction registry
        run: python scripts/validate_registry.py --json
      - name: Validate canonical TA06 prose runtime fixture
        run: |
          python scripts/validate_prose_runtime.py --json \
            --handoff fixtures/valid_ta06_prose_handoff.json \
            --reader-contract fixtures/valid_prose_reader_contract.json \
            --audit-sidecar fixtures/valid_prose_audit_sidecar.json \
            --article fixtures/20260815_demo-explainer.md
      - name: Validate canonical Probe post-audit transform fixture
        run: |
          python scripts/validate_probe_post_audit.py \
            fixtures/valid_probe_post_audit_bundle.json --json
      - name: Validate Probe TE auto-reseal delivery fixture
        run: |
          python scripts/finalize_probe_te_queue.py \
            fixtures/probe_te_unsealed_queue.json --check
      - name: Validate canonical Rendered Card Audit fixture
        run: |
          python scripts/validate_rendered_card_audit.py \
            fixtures/valid_rendered_card_audit.json --json
      - name: Validate RCA source-surface closure fixture
        run: |
          python scripts/validate_rendered_card_source_closure.py \
            fixtures/valid_rendered_card_audit.json --json
